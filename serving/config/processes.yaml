# Stage 2 local process manifest for the Windows start/stop script.
# 只描述"如何启动"；不包含密钥。端口必须与 workers.yaml 保持一致（脚本会校验）。
#
# 地址策略：默认本地单机（127.0.0.1）。局域网部署通过环境变量覆盖，不要改死本文件：
#   TMF_GATEWAY_HOST=192.168.x.x   # 网关监听地址
#   TMF_GATEWAY_PORT=8000
#   TMF_BIND_HOST=192.168.x.x      # 5 个 Flask worker 监听地址
# 详见 README「环境配置」。
version: 1

gateway:
  host: "127.0.0.1"
  port: 8000
  app: "serving.gateway.main:app"
  startup_timeout_s: 60

workers:
  rf:
    module_dir: "01-rf"
    script: "api_flask_server.py"
    port: 8101
    startup_timeout_s: 90
  fasttext:
    module_dir: "02-fasttext"
    script: "api_flask_server.py"
    port: 8103
    startup_timeout_s: 60
  bert:
    module_dir: "03-bert"
    script: "api_flask_server.py"
    port: 8104
    startup_timeout_s: 150
  llm:
    module_dir: "04-LLM"
    script: "api_flask_server.py"
    port: 8105
    startup_timeout_s: 60
  distill:
    module_dir: "05-distill"
    script: "api_flask_server.py"
    port: 8106
    startup_timeout_s: 120
